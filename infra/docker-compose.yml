# SpinToWin 整套環境。於 infra/ 執行：docker compose up -d --build（網站：http://localhost）
# 所有可調參數都有預設值；要覆寫時複製 .env.example 成 .env 再修改。
name: spintowin

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_URL: http://discovery:8761/eureka/
    # token 的 iss 是瀏覽器看到的 Keycloak 位址；公鑰則從容器網路內的 keycloak 取得
    KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/spintowin
    KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/spintowin/protocol/openid-connect/certs
    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-spintowin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-spintowin}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次啟動時建立各服務的 schema 並授權給 DB_USERNAME
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 容器內以 kafka:19092 連線；本機以 localhost:${KAFKA_PORT} 連線
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # 固定 frontend URL：不論從瀏覽器（localhost）或容器內（keycloak:8080）取 token，iss 都是這個位址
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      # 容器內的 back-channel 呼叫（JWKS）仍可用 http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/realm-spintowin.json:/opt/keycloak/data/import/realm-spintowin.json:ro
      # 自訂登入頁佈景（realm 的 loginTheme 指向 spintowin）
      - ./keycloak/themes/spintowin:/opt/keycloak/themes/spintowin:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # 映像檔內沒有 curl，依官方文件以 bash /dev/tcp 查 management port 9000
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  discovery:
    <<: *java-service
    build:
      context: ../backend
      dockerfile: discovery/Dockerfile
    image: spintowin/discovery:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  campaign-service:
    <<: *java-service
    build:
      context: ../backend
      dockerfile: campaign-service/Dockerfile
    image: spintowin/campaign-service:latest
    # 不對外開 port：只經 gateway 存取，因此可用 --scale campaign-service=N 擴展
    environment:
      <<: *java-env
      DB_USERNAME: ${DB_USERNAME:-spintowin}
      DB_PASSWORD: ${DB_PASSWORD:-spintowin}
      # 容器網路內的位址；REDIS_PORT 在 .env 中是對外 port，這裡固定為容器內的 6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 消費 draw.completed（consumer group campaign-service），更新 remaining_stock
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery:
        condition: service_healthy
      # draw-service 啟動時以正確的 partition 數建立 draw.completed；consumer 先訂閱會讓 broker 自動建成 1 個 partition
      draw-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 抽獎熱路徑：只連 Redis（不連 MySQL），可用 --scale draw-service=N 擴展。
  # 內建 outbox relay：所有實例共用一個 Redis consumer group，把 draw.completed 轉送 Kafka。
  draw-service:
    <<: *java-service
    build:
      context: ../backend
      dockerfile: draw-service/Dockerfile
    image: spintowin/draw-service:latest
    environment:
      <<: *java-env
      # 容器網路內的位址；REDIS_PORT 在 .env 中是對外 port，這裡固定為容器內的 6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # topic draw.completed 由 draw-service 啟動時建立
      KAFKA_DRAW_COMPLETED_PARTITIONS: ${KAFKA_DRAW_COMPLETED_PARTITIONS:-6}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 消費 draw.completed，把每個 Draw Result 寫進 record schema（draw_id UNIQUE 去重）；提供我的紀錄與後台統計。
  # 所有實例共用 Kafka consumer group record-service，可用 --scale record-service=N 擴展（上限為 partition 數）。
  record-service:
    <<: *java-service
    build:
      context: ../backend
      dockerfile: record-service/Dockerfile
    image: spintowin/record-service:latest
    environment:
      <<: *java-env
      DB_USERNAME: ${DB_USERNAME:-spintowin}
      DB_PASSWORD: ${DB_PASSWORD:-spintowin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery:
        condition: service_healthy
      # draw-service 啟動時以設定的 partition 數建立 draw.completed；先等它，避免 broker 自動建立 1 個 partition 的 topic
      draw-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    <<: *java-service
    build:
      context: ../backend
      dockerfile: gateway/Dockerfile
    image: spintowin/gateway:latest
    environment:
      <<: *java-env
      # 抽獎 API 每使用者限流的 token bucket（容器網路內的位址；.env 的 REDIS_PORT 是對外 port）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 每秒回補幾次、最多連續幾次（預設每人每秒 5 次）
      DRAW_RATE_LIMIT_REPLENISH_RATE: ${DRAW_RATE_LIMIT_REPLENISH_RATE:-5}
      DRAW_RATE_LIMIT_BURST_CAPACITY: ${DRAW_RATE_LIMIT_BURST_CAPACITY:-5}
    # Swagger UI：http://localhost:8000/swagger-ui.html（Keycloak client spintowin-swagger 的 redirect URI 綁定 8000）
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery:
        condition: service_healthy
      campaign-service:
        condition: service_healthy
      draw-service:
        condition: service_healthy
      record-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Nginx：提供前端靜態檔（http://localhost），並把 /api 反向代理到 gateway
  frontend:
    build:
      context: ../frontend
      args:
        # 瀏覽器導向登入的 Keycloak 位址（建置時寫入前端）
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
    image: spintowin/frontend:latest
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM: http://gateway:8000
    ports:
      # Keycloak 的 spintowin-frontend client 只允許 http://localhost/* 與 http://localhost:5173/* 當 redirect URI
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  kafka-data:
