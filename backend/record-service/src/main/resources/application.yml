# 共用設定。所有連線資訊以 ${ENV:預設值} 注入；預設值對應 local profile。
# record-service 消費 draw.completed，把每個 Draw Result 寫進 record schema（draw_id UNIQUE 去重）。
spring:
  application:
    name: record-service
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/record?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:spintowin}
    password: ${DB_PASSWORD:spintowin}
    hikari:
      pool-name: record-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # 每個消費服務自己一個 group；新 group 從最早的事件開始讀
      group-id: ${KAFKA_CONSUMER_GROUP:record-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      # value 以字串接收、在 listener 內解析：格式錯誤的事件才能原封不動送進 DLT
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:200}
    listener:
      # listener 回傳（交易已 commit）後才 commit offset
      ack-mode: batch
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    # 只用於把無法處理的事件送到 DLT
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri 用於驗證 token 的 iss；jwk-set-uri 用於取得公鑰（容器內可改指向 keycloak 主機名稱）
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/spintowin}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/spintowin/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8083}
  request:
    header:
      forwarded:
        # 只經 gateway 存取：採用 gateway 產生的 X-Forwarded-*（含 Prefix=/api/v1），
        # Problem Details 的 instance 與 Location header 才會是使用者呼叫的網址
        strategy: framework
        use-prefix: true

record:
  consumer:
    # 非暫時性錯誤（例如資料超出欄位長度）最多重試幾次，之後送進 DLT
    max-retries: ${RECORD_CONSUMER_MAX_RETRIES:3}
    retry-initial-interval: ${RECORD_CONSUMER_RETRY_INITIAL_INTERVAL:500ms}
    # 資料庫暫時無法使用時無限重試（不跳過事件），重試間隔最多拉長到這個值
    retry-max-interval: ${RECORD_CONSUMER_RETRY_MAX_INTERVAL:30s}
    dead-letter-topic: ${RECORD_DEAD_LETTER_TOPIC:draw.completed.record-service.DLT}
    dead-letter-partitions: ${RECORD_DEAD_LETTER_PARTITIONS:1}
    dead-letter-replicas: ${RECORD_DEAD_LETTER_REPLICAS:1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # 以容器 IP 註冊，gateway 才能直接連到每個 --scale 出來的實例
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL_SECONDS:10}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI（/v3/api-docs）：由 gateway 的 Swagger UI 匯集。server、Keycloak 授權與錯誤格式來自 common。
spintowin:
  openapi:
    description: "抽獎紀錄：USER 查自己的紀錄（新到舊、分頁）；ADMIN 看各 Prize 抽出數與總抽獎次數。紀錄經 Kafka 非同步寫入，通常 1 秒內出現。"
springdoc:
  default-produces-media-type: application/json
